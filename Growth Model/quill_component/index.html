<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fff; }

    #toolbar {
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: #f8f8f8;
      padding: 4px;
      direction: ltr;
    }
    #editor-container {
      border: 1px solid #ccc;
      border-radius: 0 0 4px 4px;
      min-height: 180px;
    }
    .ql-editor {
      direction: rtl;
      text-align: right;
      font-family: Arial, sans-serif;
      font-size: 13px;
      min-height: 160px;
    }
    .ql-editor p { margin: 0 0 4px; }
    .ql-container { border: none !important; }
    .ql-toolbar { border: none !important; }

    /* table styles inside editor */
    .ql-editor table { border-collapse: collapse; width: 100%; margin: 6px 0; }
    .ql-editor td, .ql-editor th {
      border: 1px solid #888;
      padding: 4px 8px;
      min-width: 60px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="ql-formats">
      <select class="ql-header">
        <option value="1">כותרת 1</option>
        <option value="2">כותרת 2</option>
        <option value="3">כותרת 3</option>
        <option selected></option>
      </select>
    </span>
    <span class="ql-formats">
      <button class="ql-bold" title="מודגש"></button>
      <button class="ql-underline" title="קו תחתון"></button>
      <button class="ql-italic" title="נטוי"></button>
    </span>
    <span class="ql-formats">
      <button class="ql-align" value="right"  title="ישור לימין"></button>
      <button class="ql-align" value="center" title="ישור למרכז"></button>
      <button class="ql-align" value="left"   title="ישור לשמאל"></button>
    </span>
    <span class="ql-formats">
      <button class="ql-list" value="ordered" title="רשימה ממוספרת"></button>
      <button class="ql-list" value="bullet" title="רשימה תבליטית"></button>
    </span>
    <span class="ql-formats">
      <button class="ql-link" title="קישור"></button>
    </span>
    <span class="ql-formats">
      <button class="ql-clean" title="נקה עיצוב"></button>
    </span>
  </div>
  <div id="editor-container">
    <div id="editor"></div>
  </div>

  <script>
    // ── Streamlit component messaging ────────────────────────────────────────
    function sendToStreamlit(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data),
        '*'
      );
    }

    function setFrameHeight(h) {
      sendToStreamlit('streamlit:setFrameHeight', { height: h });
    }

    function setComponentValue(value) {
      sendToStreamlit('streamlit:setComponentValue', { value: value });
    }

    // ── Quill init ───────────────────────────────────────────────────────────
    // Use class-based alignment so Quill outputs ql-align-* CSS classes
    var AlignClass = Quill.import('attributors/class/align');
    AlignClass.whitelist = ['right', 'center', 'left', 'justify'];
    Quill.register(AlignClass, true);

    var quill = new Quill('#editor', {
      theme: 'snow',
      modules: { toolbar: '#toolbar' },
      placeholder: 'הזן כאן הערות, הנחות יסוד, מגבלות, המלצות לממשל...'
    });

    var _initialised = false;

    // ── Receive props from Streamlit ─────────────────────────────────────────
    window.addEventListener('message', function (event) {
      var data = event.data;
      if (!data || !data.isStreamlitMessage) return;

      if (data.type === 'streamlit:render') {
        var args = data.args || {};

        // Set initial value only once (avoid clobbering while user types)
        if (!_initialised) {
          _initialised = true;
          var initVal = args.value || '';
          if (initVal) {
            quill.root.innerHTML = initVal;
          }
          // Send initial value back so Python gets it on first render
          setComponentValue(quill.root.innerHTML);
        }

        // Adjust height from props if provided
        var height = args.height || 240;
        document.getElementById('editor-container').style.minHeight = height + 'px';
        document.querySelector('.ql-editor').style.minHeight = (height - 20) + 'px';
        updateFrameHeight();
      }

      if (data.type === 'streamlit:componentReady') {
        sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
      }
    });

    // ── Propagate edits to Streamlit ─────────────────────────────────────────
    quill.on('text-change', function () {
      setComponentValue(quill.root.innerHTML);
      updateFrameHeight();
    });

    // ── Auto-size frame ──────────────────────────────────────────────────────
    function updateFrameHeight() {
      var h = document.body.scrollHeight + 8;
      setFrameHeight(h);
    }

    // Signal ready
    sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
    setTimeout(updateFrameHeight, 100);
  </script>
</body>
</html>
